<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — Owen Scott</title>

    <link rel="stylesheet" href="style.css">
    <script src="contact.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Owen Scott</a>

            <div class="nav-links">
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </div>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact</h2>

            <p>
                I'm always interested in connecting, collaborating, and
                talking about new ideas.
            </p>

            <form class="contact-form" id="contact-form">
                <div class="form-honeypot" aria-hidden="true">
                    <label for="website">Leave this field empty</label>
                    <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
                </div>

                <label for="name">Name</label>
                <input id="name" name="name" type="text" autocomplete="name" maxlength="100" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" maxlength="5000" required></textarea>

                <button class="button" type="submit">Send message</button>
                <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
            </form>

            <p class="contact-privacy">
                Your name, email, and message will be stored so I can respond.
                Please don't include sensitive information.
            </p>

            <p>
                Prefer email? <a href="mailto:owen@owenscott.us">owen@owenscott.us</a>
            </p>

            <noscript>
                <p>JavaScript is needed to send the form. Please email me directly.</p>
            </noscript>

        </section>

    </main>

</body>
</html>
